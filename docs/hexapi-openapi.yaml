  ## ---------------------------------------------------------------
  ## Outbound webhook subscriptions
  ## ---------------------------------------------------------------

  /api/webhooks:
    post:
      tags: [webhooks]
      operationId: registerWebhook
      summary: Register a webhook subscription for an engine event.
      description: |
        Returns the assigned id + secret in the 201 body. The secret
        is the HMAC-SHA256 key used to sign delivery payloads —
        capture it on register; list / get responses never echo it
        back. Auto-disable triggers after 5 consecutive transport
        errors or 5xx responses from the consumer.
      parameters:
        - $ref: '#/components/parameters/XHexDekOwner'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, event_type]
              properties:
                url:
                  type: string
                  format: uri
                  description: Delivery target. https://* always allowed; http://* only for loopback.
                event_type:
                  type: string
                  enum: [game.end]
      responses:
        "201":
          description: Webhook registered.
          content:
            application/json:
              schema:
                type: object
                required: [id, url, event_type, secret, created_at]
                properties:
                  id: { type: integer, format: int64 }
                  url: { type: string }
                  event_type: { type: string }
                  secret:
                    type: string
                    description: HMAC-SHA256 key; returned ONCE on register. Store it.
                  created_at:
                    type: integer
                    format: int64
                    description: Unix seconds.
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      tags: [webhooks]
      operationId: listWebhooks
      summary: List caller-owned webhooks. Secret is omitted.
      parameters:
        - $ref: '#/components/parameters/XHexDekOwner'
      responses:
        "200":
          description: Webhook list.
          content:
            application/json:
              schema:
                type: object
                required: [owner, webhooks]
                properties:
                  owner: { type: string }
                  webhooks:
                    type: array
                    items:
                      type: object
                      required: [id, url, event_type, created_at, active]
                      properties:
                        id: { type: integer, format: int64 }
                        url: { type: string }
                        event_type: { type: string }
                        created_at: { type: integer, format: int64 }
                        last_fired_at: { type: integer, format: int64 }
                        last_status: { type: integer }
                        failures: { type: integer }
                        active: { type: boolean }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /api/webhooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Webhook row id from POST /api/webhooks.
        schema:
          type: integer
          format: int64
    delete:
      tags: [webhooks]
      operationId: deleteWebhook
      summary: Delete a webhook subscription. Owner-gated.
      description: |
        Returns 404 both when the id is unknown and when it is owned
        by a different caller — the existence of someone else's
        subscription is intentionally not leaked.
      parameters:
        - $ref: '#/components/parameters/XHexDekOwner'
      responses:
        "200":
          description: Webhook deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, id]
                properties:
                  deleted: { type: boolean }
                  id: { type: integer, format: int64 }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /api/webhooks/{id}/dead-letters:
    parameters:
      - name: id
        in: path
        required: true
        description: Webhook row id from POST /api/webhooks.
        schema:
          type: integer
          format: int64
    get:
      tags: [webhooks]
      operationId: listWebhookDeadLetters
      summary: List terminal delivery failures (post-retry-exhaustion + 4xx) for one webhook.
      description: |
        Each row carries the full payload + last status / error so an
        operator can replay or audit. Two sources land rows here:

          - Retry exhaustion: a delivery that failed `MaxAttempts`
            times with retriable statuses (5xx / 429 / transport).
          - Permanent failures: any non-429 4xx — bad URL, expired
            auth, target removed — dead-letters on the first attempt
            with no retry.

        Owner-gated: callers see only their own webhooks'
        dead-letters. A 404 covers both "no such webhook" and
        "webhook owned by someone else" so subscription existence
        doesn't leak.
      parameters:
        - $ref: '#/components/parameters/XHexDekOwner'
        - name: limit
          in: query
          required: false
          description: Max rows to return (1..500; default 50).
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: Dead-letter list, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [webhook_id, dead_letters]
                properties:
                  webhook_id:
                    type: integer
                    format: int64
                  dead_letters:
                    type: array
                    items:
                      type: object
                      required: [id, webhook_id, event_type, payload, attempts, last_status, first_attempted, last_attempted]
                      properties:
                        id: { type: integer, format: int64 }
                        webhook_id: { type: integer, format: int64 }
                        event_type: { type: string }
                        payload:
                          type: string
                          description: JSON-encoded delivery body (returned as a string for portability).
                        attempts: { type: integer }
                        last_status:
                          type: integer
                          description: HTTP status of the final attempt, or -1 for transport error.
                        last_error: { type: string }
                        first_attempted: { type: integer, format: int64 }
                        last_attempted: { type: integer, format: int64 }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

