openapi: 3.1.0
info:
  title: HexDek HTTP API
  version: "r60-2026-05-24"
  summary: HexDek game engine, analytics, and game-state HTTP surface.
  description: |
    OpenAPI 3.1 spec for the HexDek HTTP API exposed by
    `internal/hexapi/` and registered through
    `Handler.Register(mux)` + `Showmatch.RegisterShowmatch(mux)`.

    **Audience.** Frontend (`hexdek/` React + Vite SPA), third-party
    analytics consumers, and any future integrators against the
    public hexdek.dev surface.

    **Error envelope.** Every non-success response that originates
    inside `hexapi/` is shaped as `ErrorResponse` — `{ error: string,
    status: int }` — emitted by `writeError` in `errors.go`. A small
    number of paths (the gauntlet credits gate at the moment) extend
    the envelope with caller-actionable details via
    `writeErrorWithDetails` (see `ErrorResponseWithDetails`). Both
    shapes share the unified `error`/`status` discriminator so a
    decoder that binds `ErrorResponse` always succeeds.

    **WebSocket endpoints.** Listed in this spec for inventory
    completeness only — OpenAPI cannot model the WS message stream.
    They appear with `operationId` ending in `Ws` and a 101 response
    placeholder.

    **HTML share pages.** Endpoints under `/decks/{owner}/{id}`,
    `/cards/{name}`, `/operator/{owner}`, `/spectate`, and
    `/leaderboard` return `text/html` for crawler User-Agents (OG
    meta injection). Each lists `text/html` as its `200` content.

    **Rate limits and concurrency.** Where the handler enforces a
    server-side cap (e.g. `gauntletSem` capacity 2, deck-clone
    rate-limit per owner) the spec calls it out in the operation
    description and lists the corresponding `429` response.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: /
    description: Same-origin (default for runtime validation middleware — host-agnostic).
  - url: https://hexdek.dev
    description: Production (DARKSTAR engine behind MISTY Caddy).
  - url: http://localhost:8090
    description: Local development (default `hexdek-server` port).

tags:
  - name: decks
    description: Deck CRUD, analysis, versioning, lineage, and similarity.
  - name: deck-events
    description: Deck-scoped Server-Sent Event streams.
  - name: gauntlet
    description: Per-deck gauntlet runs (500-game default, paid past free tier).
  - name: tournaments
    description: Live tournament / gauntlet progress over SSE.
  - name: live
    description: Live spectator game endpoints and ELO drift.
  - name: games
    description: Completed game history, summaries, replays, archives.
  - name: spectate
    description: Spectator room management and live WebSockets.
  - name: cards
    description: Card oracle and per-card detail endpoints.
  - name: card-stats
    description: Per-card analytics, win rates, inclusion, by-commander.
  - name: profile
    description: Owner / authenticated user profile endpoints.
  - name: leaderboard
    description: Global ELO leaderboard and donation summary.
  - name: imports
    description: Moxfield deck import history and sources.
  - name: meta
    description: Server metadata, search, tag enumeration.
  - name: telemetry
    description: Front-end telemetry ingestion (pageview, stitch).
  - name: feedback
    description: User feedback intake.
  - name: contrib
    description: Distributed contributor compute (WS + credit ledger).
  - name: admin
    description: Operator-only routes guarded by admin token / X-HexDek-Admin.
  - name: share
    description: HTML share pages with Open Graph meta for unfurls.
  - name: webhooks
    description: External webhook intake (Ko-fi donation events).
  - name: graphql
    description: GraphQL endpoint over the game graph (proof-of-concept).

components:
  schemas:
    ErrorResponse:
      type: object
      description: |
        Unified error envelope. Returned by every non-success path
        registered under `internal/hexapi/`. `status` mirrors the HTTP
        status code so intermediaries that strip the line can still
        surface the failure code to the user. `Content-Type` is
        always `application/json` and `X-Content-Type-Options:
        nosniff` is set.
      required: [error, status]
      properties:
        error:
          type: string
          description: Human-readable failure summary, or a stable discriminator code (e.g. "insufficient_credits").
          examples: ["invalid owner or id", "deck not found"]
        status:
          type: integer
          format: int32
          description: HTTP status code, mirrored from the response status line.
          examples: [400, 404]

    ErrorResponseWithDetails:
      type: object
      description: |
        Extended `ErrorResponse` used by a small set of handlers that
        need to ship caller-actionable extras alongside the unified
        envelope — currently the gauntlet credits gate at
        `POST /api/gauntlet/{owner}/{id}`. Decoders that only bind
        `ErrorResponse` still see `error` + `status`; richer clients
        pick up the additional top-level fields.
      required: [error, status]
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
      properties:
        balance:
          type: integer
          format: int64
          description: Credits available to the caller at the moment the gate fired.
        needed:
          type: integer
          format: int64
          description: Credits required for one gauntlet run.
        quota:
          $ref: '#/components/schemas/GauntletQuotaState'

    GauntletQuotaState:
      type: object
      description: Free-tier / paid-tier posture for a single owner (mirrors `internal/credits.GauntletQuotaState`).
      properties:
        used:
          type: integer
          description: Free-tier gauntlets used today.
        free:
          type: integer
          description: Free-tier gauntlets still available today.
        free_limit:
          type: integer
          description: Daily free-tier ceiling (`credits.FreeGauntletsPerDay`).
        balance:
          type: integer
          format: int64
          description: Current credit balance.
        cost:
          type: integer
          format: int64
          description: Credits required for one paid gauntlet (`credits.CreditsPerGauntlet`).
        can_run_free:
          type: boolean
        can_run_paid:
          type: boolean

    GauntletResult:
      type: object
      description: Per-deck gauntlet progress / outcome (mirrors `hexapi.GauntletResult`).
      properties:
        deck_key:
          type: string
          description: "`<owner>/<id>` form."
          examples: ["alice/korvold"]
        commander:
          type: string
        status:
          type: string
          enum: [none, starting, running, complete, error]
        games:
          type: integer
          description: Games played so far in this run.
        target:
          type: integer
          description: Target game count for the run.
        wins:
          type: integer
        losses:
          type: integer
        win_rate:
          type: number
          format: double
        elo_start:
          type: number
          format: double
        elo_end:
          type: number
          format: double
        elo_delta:
          type: number
          format: double
        avg_turns:
          type: number
          format: double
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        top_beaten:
          type: array
          items:
            type: string
        top_lost_to:
          type: array
          items:
            type: string
        placements:
          type: array
          minItems: 4
          maxItems: 4
          description: Finish-position counts under test (seat 0). Index 0 = 1st place; 1 = 2nd; 2 = 3rd; 3 = 4th. `wins == placements[0]` and `losses == placements[1] + placements[2] + placements[3]`.
          items:
            type: integer

    DeckSummary:
      type: object
      description: Compact deck listing row (mirrors `hexapi.DeckSummary`).
      required: [id, owner, name, commander, card_count, bracket, color, imported_at]
      properties:
        id:
          type: string
        owner:
          type: string
        name:
          type: string
        commander:
          type: string
        commander_card:
          type: string
        card_count:
          type: integer
        bracket:
          type: string
          description: "Estimated WotC bracket (`b1`..`b5`)."
        color:
          type: string
          description: Color identity (single letters concatenated, e.g. `BRG`).
        imported_at:
          type: string
          format: date-time
        wbs:
          type: integer
        wbs_label:
          type: string
        game_changer_count:
          type: integer
        archetype:
          type: string
        legal:
          type: boolean
        tags:
          type: array
          items:
            type: string

    OwnerProfile:
      type: object
      description: Public-facing owner profile (mirrors `hexapi.OwnerProfile`).
      required: [owner]
      properties:
        owner:
          type: string
        country:
          type: string
          description: ISO 3166-1 alpha-2 (uppercase). Empty when no preference is stored.
          minLength: 2
          maxLength: 2

    CardStatsOverview:
      type: object
      description: Aggregated per-card analytics (mirrors `db.CardStatsOverview`).
      required: [card_name, win_rate, games_played, wins, losses, inclusion_rate, decks_using, total_decks, top_commanders, bracket_distribution]
      properties:
        card_name:
          type: string
        win_rate:
          type: number
          format: double
        games_played:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        inclusion_rate:
          type: number
          format: double
        decks_using:
          type: integer
        total_decks:
          type: integer
        top_commanders:
          type: array
          items:
            $ref: '#/components/schemas/CardCommanderStat'
        bracket_distribution:
          type: array
          items:
            $ref: '#/components/schemas/CardBracketEntry'

    CardCommanderStat:
      type: object
      required: [commander, games, wins, win_rate]
      properties:
        commander:
          type: string
        games:
          type: integer
        wins:
          type: integer
        win_rate:
          type: number
          format: double

    CardBracketEntry:
      type: object
      required: [bracket, count]
      properties:
        bracket:
          type: integer
        count:
          type: integer

    UpgradeSuggestion:
      type: object
      description: One per-slot upgrade recommendation produced by `handleDeckUpgrade`.
      properties:
        current_card:
          type: string
        suggested_card:
          type: string
        current_win_rate:
          type: number
          format: double
        suggested_win_rate:
          type: number
          format: double
        win_rate_delta:
          type: number
          format: double
        reason:
          type: string

    StartGauntletResponse:
      type: object
      required: [status, deck_key, games]
      properties:
        status:
          type: string
          enum: [started, running]
        deck_key:
          type: string
        games:
          type: integer
        credits_charged:
          type: integer
          format: int64
          description: Present only on the paid-tier path; omitted when the run was free-tier.

    DeckListResponse:
      type: array
      items:
        $ref: '#/components/schemas/DeckSummary'

    EmptyOk:
      type: object
      description: Generic success body; specific fields are response-dependent.
      additionalProperties: true

    DeckHistoryTotals:
      type: object
      description: |
        Windowed aggregate over the same rows `games` carries, NOT a
        lifetime stat. `games == wins + losses + draws`. The derived
        fields are omitted (not zeroed) when the window is empty so a
        client can distinguish "no games" from "0% over 0 games".
      required: [games, wins, losses, draws]
      properties:
        games: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        draws: { type: integer }
        win_rate:
          type: number
          format: double
          description: Ratio in 0..1 (`wins / games`). Omitted when the window is empty.
        avg_turns:
          type: number
          format: double
          description: Mean game length over the window. Omitted when the window is empty.

    DeckGameHistoryRow:
      type: object
      description: One completed game in which this deck held a seat.
      required: [game_id, finished_at, turns, seat, won, draw]
      properties:
        game_id: { type: integer, format: int64 }
        finished_at:
          type: integer
          format: int64
          description: Unix seconds.
        turns: { type: integer }
        seat:
          type: integer
          description: Seat index this deck occupied.
        won: { type: boolean }
        draw:
          type: boolean
          description: Takes precedence over `won` when classifying the result.
        end_reason:
          type: string
          description: Omitted when the game recorded no end reason.

    DeckRecord:
      type: object
      description: |
        Rolling lifetime W/L projected from `showmatch_elo`. All-zero
        when the DB has no row for the deck key or the showmatch
        wiring is absent — clients should read `games == 0` as "no
        history yet" rather than "0 wins and 0 losses".
      required: [games, wins, losses]
      properties:
        games: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        win_rate:
          type: number
          format: double
          description: Ratio in 0..1, NOT a percentage. Omitted when `games` is 0.
        rating:
          type: number
          format: double
          description: Current ELO rating. Omitted when zero / absent.

    DeckSnapshotCard:
      type: object
      description: |
        One deck entry. `name` and `quantity` are always present. The
        remaining fields only appear for decks stored as `.json` —
        the plain-text deck format carries no cost or type data.
      required: [name, quantity]
      properties:
        name: { type: string }
        quantity: { type: integer }
        cmc:
          type: integer
          description: JSON-format decks only.
        mana_cost:
          type: string
          description: JSON-format decks only; omitted when empty.
        type_line:
          type: string
          description: JSON-format decks only; the card's types joined by spaces.
      additionalProperties: true

    DeckSuggestionsAnalyzing:
      type: object
      description: |
        Placeholder returned with HTTP 200 when no suggestions
        sidecar exists yet but the deck file does — a background
        Freya run has just been started and the client should poll.
      required: [status, message]
      properties:
        status:
          type: string
          enum: [analyzing]
        message: { type: string }

    DeckSuggestions:
      type: object
      description: |
        Freya's `SuggestedChanges` rollup, served verbatim from the
        `{id}.suggestions.json` sidecar.
      required: [adds, cuts, swaps, summary, total_changes]
      properties:
        adds:
          type: array
          items: { $ref: '#/components/schemas/SuggestedAdd' }
        cuts:
          type: array
          items: { $ref: '#/components/schemas/SuggestedCut' }
        swaps:
          type: array
          items: { $ref: '#/components/schemas/SuggestedSwap' }
        summary:
          type: string
          description: Human-readable one-line rollup.
        total_changes: { type: integer }

    SuggestedAdd:
      type: object
      required: [card_name, category, priority, reason, gap_size]
      properties:
        card_name: { type: string }
        category:
          type: string
          description: e.g. `interaction`, `ramp`, `draw`, `wipes`, `tutors`, `manabase`.
        priority:
          type: integer
          description: 1-10, higher is more urgent.
          minimum: 1
          maximum: 10
        reason: { type: string }
        gap_size:
          type: integer
          description: The current-vs-target gap that motivated the add.

    SuggestedCut:
      type: object
      required: [card_name, category, priority, reason]
      properties:
        card_name: { type: string }
        category:
          type: string
          description: e.g. `cuttable`, `off_archetype`, `redundant_tutor`.
        priority: { type: integer, minimum: 1, maximum: 10 }
        reason: { type: string }

    SuggestedSwap:
      type: object
      required: [add_card_name, cut_card_name, category, priority, reason]
      properties:
        add_card_name: { type: string }
        cut_card_name: { type: string }
        category:
          type: string
          description: e.g. `manabase`, `interaction_upgrade`, `ramp_upgrade`.
        priority: { type: integer, minimum: 1, maximum: 10 }
        reason: { type: string }

    GameSearchRow:
      type: object
      description: One game matching a `/api/games/search` query.
      required: [game_id, finished_at, turns, winner, winner_name, end_reason, owner_seat, owner_won]
      properties:
        game_id: { type: integer, format: int64 }
        finished_at:
          type: integer
          format: int64
          description: Unix seconds.
        turns: { type: integer }
        winner:
          type: integer
          description: Winning seat index.
        winner_name: { type: string }
        end_reason: { type: string }
        commanders:
          type: array
          description: Per-seat commanders. Omitted when empty.
          items: { type: string }
        deck_keys:
          type: array
          description: Per-seat `owner/id` keys. Omitted when empty.
          items: { type: string }
        owner_seat:
          type: integer
          description: |
            Seat the `owner` filter matched, or `-1` when no owner
            filter was supplied. On a mirror (the owner seated more
            than one deck) this is the LOWEST matching seat index.
        owner_won:
          type: boolean
          description: Computed against `owner_seat`; meaningless when `owner_seat` is -1.

    ReplayEvent:
      type: object
      description: One entry in a replay's chronological event log.
      required: [turn, kind, seat, description]
      properties:
        turn: { type: integer }
        kind:
          type: string
          description: Event discriminator, e.g. `game_end`.
        seat: { type: integer }
        card_name:
          type: string
          description: Omitted when the event is not card-scoped.
        score:
          type: integer
          description: Omitted when zero.
        is_commander:
          type: boolean
          description: Omitted when false.
        description: { type: string }

    MVPCard:
      type: object
      description: |
        A high-impact permanent on a seat's battlefield at game end.
        `score` is the end-state proxy
        `effective_cmc + positive_counters + (4 if commander)`.
      required: [seat, card_name, cmc, turn_played, counters, score, is_commander]
      properties:
        seat: { type: integer }
        card_name: { type: string }
        cmc: { type: integer }
        turn_played: { type: integer }
        counters: { type: integer }
        score: { type: integer }
        is_commander: { type: boolean }

    RegretCard:
      type: object
      description: A card a seat held but never deployed.
      required: [seat, card_name, cmc, reason]
      properties:
        seat: { type: integer }
        card_name: { type: string }
        cmc: { type: integer }
        reason:
          type: string
          description: How the regret was identified.

    MulliganStat:
      type: object
      description: |
        One seat's opening-hand outcome under the London mulligan.
        All fields except `mulligans_taken` describe the FINAL
        post-bottom hand.
      required: [seat, mulligans_taken, opening_hand_size, lands, action_cards, keepable]
      properties:
        seat: { type: integer }
        mulligans_taken: { type: integer }
        opening_hand_size: { type: integer }
        lands: { type: integer }
        action_cards: { type: integer }
        keepable: { type: boolean }

    CommanderZoneVisit:
      type: object
      description: One seat's commander zone-movement tally.
      required: [seat, commander_name, cast_count, in_zone_at_end, visits]
      properties:
        seat: { type: integer }
        commander_name: { type: string }
        cast_count: { type: integer }
        in_zone_at_end: { type: boolean }
        visits: { type: integer }

    TurningPoint:
      type: object
      description: A derived pivotal moment in the game.
      required: [turn, kind, seat, description]
      properties:
        turn: { type: integer }
        kind: { type: string }
        seat: { type: integer }
        description: { type: string }

    FullReplayResponse:
      type: object
      required: [game_id, total_turns, winner, events]
      properties:
        game_id: { type: integer, format: int64 }
        total_turns:
          type: integer
          description: '`max(seed.turns, final_turn)` from the snapshot.'
        winner:
          type: integer
          description: Winning seat index as recorded in the snapshot seed.
        events:
          type: array
          items: { $ref: '#/components/schemas/ReplayEvent' }

    TurnStateResponse:
      type: object
      required: [game_id, turn, total_turns, events_through_n, mvps_emerged]
      properties:
        game_id: { type: integer, format: int64 }
        turn:
          type: integer
          description: The turn requested in the path.
        total_turns: { type: integer }
        events_through_n:
          type: array
          description: Events with `turn <= n`, minus the terminal `game_end` when `n < total_turns`.
          items: { $ref: '#/components/schemas/ReplayEvent' }
        mvps_emerged:
          type: array
          description: MVP cards whose `turn_played` falls in 1..n.
          items: { $ref: '#/components/schemas/MVPCard' }

    ForensicsResponse:
      type: object
      description: Every array is `[]` rather than `null` when empty.
      required: [game_id, winner, total_turns, turning_points, mvp_cards, regret_cards, mulligan_stats, commander_zone_visits]
      properties:
        game_id: { type: integer, format: int64 }
        winner: { type: integer }
        total_turns: { type: integer }
        turning_points:
          type: array
          items: { $ref: '#/components/schemas/TurningPoint' }
        mvp_cards:
          type: array
          items: { $ref: '#/components/schemas/MVPCard' }
        regret_cards:
          type: array
          items: { $ref: '#/components/schemas/RegretCard' }
        mulligan_stats:
          type: array
          items: { $ref: '#/components/schemas/MulliganStat' }
        commander_zone_visits:
          type: array
          items: { $ref: '#/components/schemas/CommanderZoneVisit' }

    LineageNode:
      type: object
      description: |
        One node in a card instance's provenance tree. Recursive via
        `source`, `enabler` and `merged`.
      required: [instance_id]
      properties:
        instance_id: { type: string }
        name: { type: string }
        provenance:
          type: string
          description: How this instance came to exist.
        source_instance_id: { type: string }
        enabler_instance_id: { type: string }
        enabler_history:
          type: array
          items: { type: string }
        merged_card_ids:
          type: array
          items: { type: string }
        source: { $ref: '#/components/schemas/LineageNode' }
        enabler: { $ref: '#/components/schemas/LineageNode' }
        merged:
          type: array
          items: { $ref: '#/components/schemas/LineageNode' }
        description: { type: string }

    LineageResponse:
      type: object
      required: [instance_id, tree]
      properties:
        instance_id:
          type: string
          description: Echo of the requested InstanceID.
        tree:
          $ref: '#/components/schemas/LineageNode'
        text:
          type: string
          description: Flat tooltip-ready rendering of the same tree. Omitted when empty.

    Tag:
      type: string
      description: Free-form tag string applied to a deck.

  parameters:
    OwnerParam:
      name: owner
      in: path
      required: true
      description: |
        Owner slug. Path components MUST satisfy `validatePathComponent`:
        non-empty, not "." or "..", no `/`, `\`, or NUL byte, and only
        `[A-Za-z0-9._-]`. Violations return `400 invalid owner` (or
        `invalid owner or id`).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]+$'
        examples: ["alice"]

    DeckIdParam:
      name: id
      in: path
      required: true
      description: Deck id. Same validation rules as `owner`.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]+$'
        examples: ["korvold_combo"]

    CardNameParam:
      name: name
      in: path
      required: true
      description: Card name (URL-escaped; spaces survive percent-decoding).
      schema:
        type: string
        examples: ["Sol Ring"]

    CardNameSlugParam:
      name: cardName
      in: path
      required: true
      description: Card name (URL-escaped) for the card-stats sub-tree.
      schema:
        type: string
        examples: ["Sol Ring"]

    CommanderParam:
      name: commander
      in: path
      required: true
      description: Commander name (URL-escaped).
      schema:
        type: string
        examples: ["Korvold, Fae-Cursed King"]

    GameIdParam:
      name: id
      in: path
      required: true
      description: Game UUID.
      schema:
        type: string
        format: uuid

    RoomIdParam:
      name: room_id
      in: path
      required: true
      description: Spectate room id.
      schema:
        type: string

    ReplayGameIdParam:
      name: game_id
      in: path
      required: true
      description: |
        Numeric game id (`showmatch_game.id`). Must parse as a
        positive int64 — a non-numeric or non-positive value is a
        400 (`invalid game id` on the `/api/replay` routes,
        `invalid game_id` on the event stream). Note this is NOT the
        UUID form used by the `/api/games/{id}` sub-tree.
      schema:
        type: integer
        format: int64
        minimum: 1

    XHexDekOwner:
      name: X-HexDek-Owner
      in: header
      required: false
      description: |
        Caller identity used by the credits ledger and ownership
        checks. Lowercased before comparison. Absent → anonymous /
        free-tier path; required by ownership-gated mutating routes
        (`PUT /api/decks/{owner}/{id}`, `PATCH .../curse`, etc).
      schema:
        type: string

  responses:
    BadRequest:
      description: Validation failed — missing or malformed input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication for a gated route.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Caller authenticated but lacks ownership / admin rights.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflict (e.g. too many decks with the same name on clone).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PaymentRequired:
      description: |
        Caller exhausted the free-tier daily quota and either has
        insufficient credits to upgrade (`free_quota_exhausted`) or
        a credit-spend attempt failed with insufficient balance
        (`insufficient_credits`). Body extends `ErrorResponse` with
        `balance`, `needed`, and `quota`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseWithDetails'
    TooManyRequests:
      description: |
        Server-side rate limit / concurrency cap engaged. Examples:
        `gauntletSem` (capacity 2) is saturated; per-owner clone
        rate-limit exceeded; feedback rate-limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: A dependency (DB, anomaly auditor, contrib pipeline) is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: Upstream call (e.g. Moxfield) failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Server-side failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:
  ## ---------------------------------------------------------------
  ## Decks: CRUD + analysis + lineage
  ## ---------------------------------------------------------------

  /api/decks:
    get:
      tags: [decks]
      operationId: listDecks
      summary: List all decks, optionally filtered.
      parameters:
        - name: owner
          in: query
          required: false
          schema:
            type: string
        - name: contains
          in: query
          required: false
          description: Case-insensitive substring filter against deck name / commander.
          schema:
            type: string
      responses:
        "200":
          description: Deck list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckListResponse'
        "500": { $ref: '#/components/responses/InternalError' }

    post:
      tags: [decks]
      operationId: importDeck
      summary: Create a new deck from a pasted deck list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deck_list]
              properties:
                deck_list:
                  type: string
                  description: Plain-text deck list (one card per line).
                owner:
                  type: string
                name:
                  type: string
      responses:
        "201":
          description: Deck created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "409": { $ref: '#/components/responses/Conflict' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/decks/import:
    post:
      tags: [decks]
      operationId: importDeckExplicit
      summary: Alias for `POST /api/decks` (full-page import flow).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deck_list]
              properties:
                deck_list:
                  type: string
                owner:
                  type: string
                name:
                  type: string
      responses:
        "201":
          description: Deck created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "409": { $ref: '#/components/responses/Conflict' }

  /api/decks/{owner}/{id}:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    get:
      tags: [decks]
      operationId: getDeck
      summary: Get a single deck with cards, metadata, and freya summary.
      responses:
        "200":
          description: Deck detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/InternalError' }
    put:
      tags: [decks]
      operationId: updateDeck
      summary: Replace the deck's mainboard.
      parameters:
        - $ref: '#/components/parameters/XHexDekOwner'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deck_list]
              properties:
                deck_list:
                  type: string
      responses:
        "200":
          description: Deck updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [decks]
      operationId: patchDeck
      summary: Patch deck metadata (name, tags). Ownership-gated.
      parameters:
        - $ref: '#/components/parameters/XHexDekOwner'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                tags:
                  type: array
                  items:
                    $ref: '#/components/schemas/Tag'
      responses:
        "200":
          description: Deck metadata patched.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [decks]
      operationId: deleteDeck
      summary: Delete a deck. Ownership-gated.
      parameters:
        - $ref: '#/components/parameters/XHexDekOwner'
      responses:
        "200":
          description: Deck deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/decks/{owner}/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    get:
      tags: [decks]
      operationId: listDeckVersions
      summary: List historical versions of a deck.
      responses:
        "200":
          description: Version list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }

  /api/decks/{owner}/{id}/archetype-feedback:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    post:
      tags: [decks]
      operationId: postArchetypeFeedback
      summary: Confirm or correct Freya's system-assigned archetype. Persists user feedback into deck_meta + appends to the archetype_feedback_log training signal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [confirm, correct, clear]
                archetype:
                  type: string
                  description: Required when action=correct; user-supplied override (any non-empty string, normalized server-side).
              required: [action]
      responses:
        "200":
          description: Feedback recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/freya/training-signal:
    get:
      tags: [decks]
      operationId: getArchetypeTrainingSignal
      summary: Aggregate (freya_archetype → user_archetype) correction clusters from archetype_feedback_log. Surfaces patterns where N+ distinct owners have overridden Freya, feeding back into manual archetype-fingerprint review.
      parameters:
        - name: min
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 5 }
          description: Minimum distinct-owner count for a cluster to surface. Defaults to 5 per the documented training-loop threshold.
      responses:
        "200":
          description: Clusters + echoed threshold + generated_at timestamp.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "503":
          description: Database not available.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/decks/{owner}/{id}/freya-export:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    get:
      tags: [decks]
      operationId: getFreyaExport
      summary: External-consumer JSON envelope bundling Freya's full strategy.json analysis with deck context (commander, color identity, card list) and R60 extras (system_tags, user_archetype_feedback, version_hash). Schema-versioned for stable third-party integration (EDHrec, external deck-builders). Read-only — returns 404 when strategy.json doesn't yet exist rather than auto-kicking-off Freya like /analysis does.
      responses:
        "200":
          description: Full Freya export envelope with schema_version, generated_at, deck, analysis (passthrough), and extras.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/decks/{owner}/{id}/archetype-history:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    get:
      tags: [decks]
      operationId: getArchetypeHistory
      summary: Chronological timeline of a deck's archetype state — Freya's per-version classifications merged with user confirm/correct/clear actions from the feedback log.
      responses:
        "200":
          description: Event list ordered chronologically.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/decks/{owner}/{id}/budget:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    get:
      tags: [decks]
      operationId: getDeckBudget
      summary: USD price rollup. Pulls per-card prices from the Scryfall-backed oracle cache and returns total + per-card breakdown + top contributors. Basics priced at $0.
      responses:
        "200":
          description: Budget rollup.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/decks/{owner}/{id}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1, maximum: 500 }
    get:
      tags: [decks]
      operationId: getDeckVersion
      summary: Get one historical version's decklist text + parsed cards. Drives the DECK HISTORY view's per-row diff.
      responses:
        "200":
          description: Version body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/decks/{owner}/{id}/version-trends:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    get:
      tags: [decks]
      operationId: getDeckVersionTrends
      summary: Per-version winrate rollup for this deck. Buckets each game into the version that was HEAD at its finished_at timestamp.
      responses:
        "200":
          description: |
            Per-version rollup. `versions` lists every version in chronological order with its games/wins/losses/draws/win_rate (0..1).
            `untracked_games` counts games predating the earliest known version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }

  /api/decks/{owner}/{id}/analysis:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    get:
      tags: [decks]
      operationId: getDeckAnalysis
      summary: Get Freya analysis output (archetype, combos, win lines, roles).
      responses:
        "200":
          description: 'Freya strategy + deck profile JSON. Returns `{status:"analyzing"}` if analysis is in-flight.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/decks/{owner}/{id}/analyze:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    post:
      tags: [decks]
      operationId: runDeckAnalysis
      summary: Kick off Freya analysis for a deck.
      responses:
        "200":
          description: Analysis launch acknowledged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  deck:
                    type: string
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/decks/{owner}/{id}/matchups:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    get:
      tags: [decks]
      operationId: getDeckMatchups
      summary: Per-opponent matchup record for this deck.
      responses:
        "200":
          description: Matchup list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deck_key:
                    type: string
                  matchups:
                    type: array
                    items: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/decks/{owner}/{id}/elo-history:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    get:
      tags: [decks]
      operationId: getDeckEloHistory
      summary: Time-series of ELO deltas for this deck.
      responses:
        "200":
          description: ELO run history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deck_key:
                    type: string
                  runs:
                    type: array
                    items: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/decks/{owner}/{id}/upgrade:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    get:
      tags: [decks]
      operationId: getDeckUpgrade
      summary: Suggest higher win-rate card swaps for this deck.
      responses:
        "200":
          description: Upgrade suggestions + meta (`reason` populated when suggestions are empty for an explainable reason — e.g. no card_stats data).
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items: { $ref: '#/components/schemas/UpgradeSuggestion' }
                  meta:
                    type: object
                    additionalProperties: true
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/decks/{owner}/{id}/clone:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    post:
      tags: [decks]
      operationId: cloneDeck
      summary: Clone someone else's deck into the caller's account.
      description: Rate-limited per caller (`CloneRateLimit` per hour). Cannot self-clone.
      parameters:
        - $ref: '#/components/parameters/XHexDekOwner'
      responses:
        "200":
          description: Clone created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "429": { $ref: '#/components/responses/TooManyRequests' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/decks/{owner}/{id}/fork:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    post:
      tags: [decks]
      operationId: forkDeck
      summary: Fork someone else's deck into the caller's account with attribution preserved.
      description: |
        Parallel to clone but maintains a `forked_from` pointer that's surfaced
        prominently in the UI as "Forked from <owner>/<id>". Rate-limited per
        caller (`ForkRateLimit` per hour) against a separate budget from clone.
        Cannot self-fork.
      parameters:
        - $ref: '#/components/parameters/XHexDekOwner'
      responses:
        "200":
          description: Fork created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "429": { $ref: '#/components/responses/TooManyRequests' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/decks/{owner}/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    get:
      tags: [decks]
      operationId: getDeckArchive
      summary: Consolidated deck archive (identity + lineage + games + archetype timeline).
      description: |
        Returns the full archive blob: identity (current commander +
        archetype), the version DAG with per-version games / wins /
        losses / winrate, aggregate game stats, the trailing N
        recent games, and an archetype evolution timeline. Empty
        payload (200) when the deck has no lineage / games yet —
        the frontend renders that as "no history" rather than 404.
      parameters:
        - name: recent
          in: query
          required: false
          description: How many trailing games to include in the archive blob.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Deck archive document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/decks/{owner}/{id}/lineage:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    get:
      tags: [decks]
      operationId: getDeckLineage
      summary: Show ancestor / descendant lineage walk for this deck.
      responses:
        "200":
          description: Lineage list (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/decks/{owner}/{id}/similar:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    get:
      tags: [decks]
      operationId: getSimilarDecks
      summary: Find decks similar to this one by card overlap / archetype.
      responses:
        "200":
          description: Similar deck rows.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/decks/{owner}/{id}/events:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    get:
      tags: [deck-events]
      operationId: deckEventsSSE
      summary: Server-Sent Events stream of deck-scoped events.
      responses:
        "200":
          description: SSE stream.
          content:
            text/event-stream: {}
        "400": { $ref: '#/components/responses/BadRequest' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/decks/{owner}/{id}/history:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    get:
      tags: [decks]
      operationId: getDeckGameHistory
      summary: Per-game result rows for this deck plus a windowed aggregate roll-up.
      description: |
        Distinct from `/elo-history` (which returns gauntlet RUNS — a
        rating snapshot per completed N-game gauntlet) and from
        `/version-trends` (which buckets games by deck version). This
        endpoint returns individual GAMES with no version-walking.

        Rows are returned chronological-ASCENDING (the DB query is
        newest-first and the handler reverses it) so a chart can plot
        win/loss over time without re-sorting.

        `totals` aggregates across the SAME window `games` covers, so
        `totals.games == len(games)` always — it is a windowed view,
        not a lifetime stat. The lifetime view lives in
        `/snapshot`.`record`.

        When the showmatch DB is not wired, the handler returns 200
        with an empty `games` array and a zeroed `totals` rather than
        an error.
      parameters:
        - name: limit
          in: query
          required: false
          description: |
            Max rows. Default 50, silently clamped to 500 — an
            over-cap value is NOT rejected. A non-numeric or
            non-positive value is ignored and the default applies.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: Per-game rows plus windowed totals.
          content:
            application/json:
              schema:
                type: object
                required: [deck_key, totals, games]
                properties:
                  deck_key:
                    type: string
                    description: '`owner/id`.'
                    examples: ["alice/korvold_combo"]
                  totals:
                    $ref: '#/components/schemas/DeckHistoryTotals'
                  games:
                    type: array
                    description: Chronological-ascending game rows.
                    items: { $ref: '#/components/schemas/DeckGameHistoryRow' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/decks/{owner}/{id}/snapshot:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    get:
      tags: [decks]
      operationId: getDeckSnapshot
      summary: Tournament-ready one-shot summary — list, commander, bracket, archetype, colors, W/L record.
      description: |
        A single round-trip for tournament / seeding tooling that
        needs the full identification + matchmaking shape but not the
        per-version DAG, archetype history, or analysis JSON that
        `/api/decks/{owner}/{id}` + `/analysis` + `/elo-history`
        collectively provide. Side-effect-free.

        `bracket` is an INTEGER here (1..5 when known, `0` when
        unresolvable) rather than the `"?"` sentinel string the rich
        deck endpoint emits — pairing logic does ordered comparisons,
        not equality checks against sentinels.

        `record.win_rate` is a ratio in 0..1, not a percentage, and is
        omitted entirely when the deck has no recorded games.
      responses:
        "200":
          description: Deck snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [owner, id, deck_key, commander, color, bracket, primary_archetype, card_count, cards, record]
                properties:
                  owner: { type: string }
                  id: { type: string }
                  deck_key:
                    type: string
                    description: '`owner/id`.'
                  commander:
                    type: string
                    description: Resolved commander name; empty when unresolvable.
                  color:
                    type: string
                    description: Color identity as resolved by `resolveDeckMetadata`.
                  bracket:
                    type: integer
                    description: 1..5 when known, 0 when unresolvable.
                    minimum: 0
                    maximum: 5
                  primary_archetype:
                    type: string
                    description: Freya's primary archetype; empty when no analysis exists.
                  card_count:
                    type: integer
                    description: Sum of per-entry `quantity`.
                  cards:
                    type: array
                    items: { $ref: '#/components/schemas/DeckSnapshotCard' }
                  record:
                    $ref: '#/components/schemas/DeckRecord'
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/decks/{owner}/{id}/suggestions:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    get:
      tags: [decks]
      operationId: getDeckSuggestions
      summary: Prioritized deck-builder suggestions — adds, cuts, and swaps with reasons.
      description: |
        Serves the `{id}.suggestions.json` sidecar Freya writes
        alongside `strategy.json` / `profile.json`. The handler
        streams the cached file bytes through verbatim; the shape is
        Freya's `SuggestedChanges` (see
        `cmd/hexdek-freya/suggested_changes.go`).

        Read-then-fallback, mirroring `/analysis`: when the sidecar is
        absent but the deck FILE exists, the handler kicks off a
        background Freya run and returns **200** with an
        `{"status":"analyzing"}` body so the frontend can poll. It is
        NOT a 202 — the status lives in the body, not the status line.

        `404` is returned only when the deck file itself cannot be
        found.
      responses:
        "200":
          description: |
            Either the completed suggestion rollup, or the
            `analyzing` placeholder while a background Freya run is
            in flight.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DeckSuggestions'
                  - $ref: '#/components/schemas/DeckSuggestionsAnalyzing'
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/decks/{owner}/{id}/curse:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    get:
      tags: [decks]
      operationId: getDeckCurse
      summary: Get the deck's hat-curse pool (per-deck trait knobs).
      responses:
        "200":
          description: Curse pool.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "404": { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [decks]
      operationId: patchDeckCurse
      summary: Patch the deck's curse pool. Ownership-gated; values clamped to [0,1].
      parameters:
        - $ref: '#/components/parameters/XHexDekOwner'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: number
                format: double
                minimum: 0
                maximum: 1
      responses:
        "200":
          description: Curse pool patched.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/InternalError' }

  ## ---------------------------------------------------------------
  ## Gauntlet & Tournament SSE
  ## ---------------------------------------------------------------

  /api/showmatch/reload-pool:
    post:
      tags: [admin]
      operationId: reloadDeckPool
      summary: Rebuild the in-memory engine deck pool from disk.
      description: >
        Re-scans the decks directory and atomically swaps the engine deck pool —
        the in-memory set the gauntlet, showmatch and matchmaking draw from.


        HISTORY. The pool was originally built only at process start, so a deck
        imported after boot was invisible to the gauntlet until this endpoint was
        called or the server restarted. In September 2026 that state ran for
        roughly 50 hours before a user report surfaced it, because nothing
        logged, counted or alerted on the resulting refusals. Gauntlet lookups
        now read through to disk on a pool miss (see internal/hexapi/
        deckpool_readthrough.go), which means this endpoint is **no longer
        required for correctness** — it remains as an operator tool for bulk
        refresh after out-of-band changes to the decks directory.


        NOTE ON ACCESS. Tagged `admin` because it rebuilds shared engine state,
        but it is currently guarded only by CSRF (`requireCSRFLate`) and not by
        an admin token. Documenting the gap rather than silently leaving it
        undocumented; tightening it is a separate decision.
      responses:
        '200':
          description: Pool rebuilt.
          content:
            application/json:
              schema:
                type: object
                required: [status, decks]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  decks:
                    type: integer
                    description: >
                      Number of decks in the rebuilt pool. Lower than the total
                      deck count by however many failed the pool gates (parse
                      failure, no commander, fewer than 80 cards, banned
                      commander).
        '503':
          description: >
            Reload failed — card corpus/meta not loaded yet, decks directory not
            configured, or the rebuilt pool had fewer decks than a table needs.
          content:
            application/json:
              schema: { type: object }

  /api/gauntlet/{owner}/{id}:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    post:
      tags: [gauntlet]
      operationId: startGauntlet
      summary: Launch (or resume) a gauntlet run for a deck.
      description: |
        Concurrency-capped at 2 simultaneous gauntlets server-wide
        (`gauntletSem`). Free-tier callers (3/day per
        `credits.FreeGauntletsPerDay`) run for free; past that the
        handler debits `credits.CreditsPerGauntlet` credits before
        launching. Credit spends are atomic — if the launch can't
        proceed (deck missing, sem full), no debit occurs.
      parameters:
        - name: games
          in: query
          required: false
          description: Number of games to run (default 500, max 50000).
          schema:
            type: integer
            minimum: 1
            maximum: 50000
            default: 500
        - $ref: '#/components/parameters/XHexDekOwner'
      responses:
        "200":
          description: Gauntlet launch acknowledged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartGauntletResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "402": { $ref: '#/components/responses/PaymentRequired' }
        "404": { $ref: '#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/TooManyRequests' }
        "500": { $ref: '#/components/responses/InternalError' }
    get:
      tags: [gauntlet]
      operationId: getGauntlet
      summary: Get current gauntlet state for a deck.
      responses:
        "200":
          description: 'Gauntlet result (`status:"none"` when no run has been launched).'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/GauntletResult'
                  - type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        enum: [none]
        "400": { $ref: '#/components/responses/BadRequest' }

  /api/gauntlet/{owner}/{id}/stop:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    post:
      tags: [gauntlet]
      operationId: stopGauntlet
      summary: Request an early stop of this deck's running gauntlet.
      description: |
        Flags the in-flight run as stop-requested, marks it `stopped`
        with a finish timestamp, and fans the terminal state to any
        live SSE subscribers on
        `/api/tournaments/{owner}/{id}/events` so a spectating client
        sees the stop immediately instead of at its next poll.

        Idempotent and non-failing: when there is no run for the deck,
        or the run is not in `running` state, the handler returns
        **200** with `status: "not_running"` rather than a 404.

        Guarded by CSRF (`requireCSRFLate`) — callers must send the
        token from `GET /api/csrf` in `X-CSRF-Token`. No admin token
        and no ownership check is applied.
      responses:
        "200":
          description: Stop acknowledged, or reported as nothing-to-stop.
          content:
            application/json:
              schema:
                type: object
                required: [status, deck_key]
                properties:
                  status:
                    type: string
                    enum: [stopped, not_running]
                  deck_key:
                    type: string
                    description: '`owner/id`.'
        "400": { $ref: '#/components/responses/BadRequest' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/tournament/{id}/stats:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
        description: Gauntlet run id (gauntlet_runs.run_id).
    get:
      tags: [tournaments]
      operationId: getTournamentStats
      summary: Per-tournament aggregates — deck distribution, winrate variance, longest game, fastest game.
      description: |
        Anchors on a gauntlet_runs row by run_id, then scans
        showmatch_game rows in that (deck_key, started_at..finished_at)
        window to compute games-derived signals
        (deck_distribution, winrate_variance, longest_game,
        fastest_game). Run-level scalars (games/wins/losses/win_rate/
        avg_turns) echo gauntlet_runs verbatim.
      responses:
        "200":
          description: TournamentStats payload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/InternalError' }

  /api/tournament/{id}/stream:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
        description: Gauntlet run id (gauntlet_runs.run_id).
    get:
      tags: [tournaments]
      operationId: tournamentMatchStreamSSE
      summary: Server-Sent Events stream of per-match completions for a tournament.
      description: |
        Keyed by run_id (same id accepted by /api/tournament/{id}/stats),
        in contrast to /api/tournaments/{owner}/{id}/events which is
        keyed by deck. Emits one `status` event immediately, then a
        `match` event per completed game with the just-finished game's
        winner / opponents / turns + running W-L / win-rate, then a
        terminal `complete` event when the run finishes. Heartbeat
        comments every 15s keep idle proxies from dropping the
        connection. When the run is already complete at subscribe
        time, the `status` event reports `complete` and the stream
        closes immediately — clients should fall back to
        /api/tournament/{id}/stats for the full breakdown.
      responses:
        "200":
          description: "SSE stream. `status` / `match` / `complete` frames carry JSON payloads."
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/InternalError' }

  /api/tournaments/{owner}/{id}/events:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    get:
      tags: [tournaments]
      operationId: tournamentEventsSSE
      summary: Server-Sent Events stream of gauntlet progress for this deck.
      description: |
        Emits an initial `snapshot` frame with the current state, then
        further `snapshot` frames after every completed game. Stream
        terminates when the deck reaches a terminal status
        (`complete` | `error`) or the client disconnects.
      responses:
        "200":
          description: "SSE snapshot stream. Each frame's `data:` line is a JSON `GauntletResult`."
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/GauntletResult'
        "400": { $ref: '#/components/responses/BadRequest' }
        "500": { $ref: '#/components/responses/InternalError' }

