    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    get:
      tags: [decks]
      operationId: getDeckArchive
      summary: Consolidated deck archive (identity + lineage + games + archetype timeline).
      description: |
        Returns the full archive blob: identity (current commander +
        archetype), the version DAG with per-version games / wins /
        losses / winrate, aggregate game stats, the trailing N
        recent games, and an archetype evolution timeline. Empty
        payload (200) when the deck has no lineage / games yet —
        the frontend renders that as "no history" rather than 404.
      parameters:
        - name: recent
          in: query
          required: false
          description: How many trailing games to include in the archive blob.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Deck archive document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "500": { $ref: '#/components/responses/InternalError' }

