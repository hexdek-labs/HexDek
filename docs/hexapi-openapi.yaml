openapi: 3.1.0
info:
  title: HexDek HTTP API
  version: "r60-2026-05-24"
  summary: HexDek game engine, analytics, and game-state HTTP surface.
  description: |
    OpenAPI 3.1 spec for the HexDek HTTP API exposed by
    `internal/hexapi/` and registered through
    `Handler.Register(mux)` + `Showmatch.RegisterShowmatch(mux)`.

    **Audience.** Frontend (`hexdek/` React + Vite SPA), third-party
    analytics consumers, and any future integrators against the
    public hexdek.dev surface.

    **Error envelope.** Every non-success response that originates
    inside `hexapi/` is shaped as `ErrorResponse` — `{ error: string,
    status: int }` — emitted by `writeError` in `errors.go`. A small
    number of paths (the gauntlet credits gate at the moment) extend
    the envelope with caller-actionable details via
    `writeErrorWithDetails` (see `ErrorResponseWithDetails`). Both
    shapes share the unified `error`/`status` discriminator so a
    decoder that binds `ErrorResponse` always succeeds.

    **WebSocket endpoints.** Listed in this spec for inventory
    completeness only — OpenAPI cannot model the WS message stream.
    They appear with `operationId` ending in `Ws` and a 101 response
    placeholder.

    **HTML share pages.** Endpoints under `/decks/{owner}/{id}`,
    `/cards/{name}`, `/operator/{owner}`, `/spectate`, and
    `/leaderboard` return `text/html` for crawler User-Agents (OG
    meta injection). Each lists `text/html` as its `200` content.

    **Rate limits and concurrency.** Where the handler enforces a
    server-side cap (e.g. `gauntletSem` capacity 2, deck-clone
    rate-limit per owner) the spec calls it out in the operation
    description and lists the corresponding `429` response.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: /
    description: Same-origin (default for runtime validation middleware — host-agnostic).
  - url: https://hexdek.dev
    description: Production (DARKSTAR engine behind MISTY Caddy).
  - url: http://localhost:8090
    description: Local development (default `hexdek-server` port).

tags:
  - name: decks
    description: Deck CRUD, analysis, versioning, lineage, and similarity.
  - name: deck-events
    description: Deck-scoped Server-Sent Event streams.
  - name: gauntlet
    description: Per-deck gauntlet runs (500-game default, paid past free tier).
  - name: tournaments
    description: Live tournament / gauntlet progress over SSE.
  - name: live
    description: Live spectator game endpoints and ELO drift.
  - name: games
    description: Completed game history, summaries, replays, archives.
  - name: spectate
    description: Spectator room management and live WebSockets.
  - name: cards
    description: Card oracle and per-card detail endpoints.
  - name: card-stats
    description: Per-card analytics, win rates, inclusion, by-commander.
  - name: profile
    description: Owner / authenticated user profile endpoints.
  - name: leaderboard
    description: Global ELO leaderboard and donation summary.
  - name: imports
    description: Moxfield deck import history and sources.
  - name: meta
    description: Server metadata, search, tag enumeration.
  - name: telemetry
    description: Front-end telemetry ingestion (pageview, stitch).
  - name: feedback
    description: User feedback intake.
  - name: contrib
    description: Distributed contributor compute (WS + credit ledger).
  - name: admin
    description: Operator-only routes guarded by admin token / X-HexDek-Admin.
  - name: share
    description: HTML share pages with Open Graph meta for unfurls.
  - name: webhooks
    description: External webhook intake (Ko-fi donation events).
  - name: graphql
    description: GraphQL endpoint over the game graph (proof-of-concept).

components:
  schemas:
    ErrorResponse:
      type: object
      description: |
        Unified error envelope. Returned by every non-success path
        registered under `internal/hexapi/`. `status` mirrors the HTTP
        status code so intermediaries that strip the line can still
        surface the failure code to the user. `Content-Type` is
        always `application/json` and `X-Content-Type-Options:
        nosniff` is set.
      required: [error, status]
      properties:
        error:
          type: string
          description: Human-readable failure summary, or a stable discriminator code (e.g. "insufficient_credits").
          examples: ["invalid owner or id", "deck not found"]
        status:
          type: integer
          format: int32
          description: HTTP status code, mirrored from the response status line.
          examples: [400, 404]

    ErrorResponseWithDetails:
      type: object
      description: |
        Extended `ErrorResponse` used by a small set of handlers that
        need to ship caller-actionable extras alongside the unified
        envelope — currently the gauntlet credits gate at
        `POST /api/gauntlet/{owner}/{id}`. Decoders that only bind
        `ErrorResponse` still see `error` + `status`; richer clients
        pick up the additional top-level fields.
      required: [error, status]
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
      properties:
        balance:
          type: integer
          format: int64
          description: Credits available to the caller at the moment the gate fired.
        needed:
          type: integer
          format: int64
          description: Credits required for one gauntlet run.
        quota:
          $ref: '#/components/schemas/GauntletQuotaState'

    GauntletQuotaState:
      type: object
      description: Free-tier / paid-tier posture for a single owner (mirrors `internal/credits.GauntletQuotaState`).
      properties:
        used:
          type: integer
          description: Free-tier gauntlets used today.
        free:
          type: integer
          description: Free-tier gauntlets still available today.
        free_limit:
          type: integer
          description: Daily free-tier ceiling (`credits.FreeGauntletsPerDay`).
        balance:
          type: integer
          format: int64
          description: Current credit balance.
        cost:
          type: integer
          format: int64
          description: Credits required for one paid gauntlet (`credits.CreditsPerGauntlet`).
        can_run_free:
          type: boolean
        can_run_paid:
          type: boolean

    GauntletResult:
      type: object
      description: Per-deck gauntlet progress / outcome (mirrors `hexapi.GauntletResult`).
      properties:
        deck_key:
          type: string
          description: "`<owner>/<id>` form."
          examples: ["alice/korvold"]
        commander:
          type: string
        status:
          type: string
          enum: [none, starting, running, complete, error]
        games:
          type: integer
          description: Games played so far in this run.
        target:
          type: integer
          description: Target game count for the run.
        wins:
          type: integer
        losses:
          type: integer
        win_rate:
          type: number
          format: double
        elo_start:
          type: number
          format: double
        elo_end:
          type: number
          format: double
        elo_delta:
          type: number
          format: double
        avg_turns:
          type: number
          format: double
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        top_beaten:
          type: array
          items:
            type: string
        top_lost_to:
          type: array
          items:
            type: string
        placements:
          type: array
          minItems: 4
          maxItems: 4
          description: Finish-position counts under test (seat 0). Index 0 = 1st place; 1 = 2nd; 2 = 3rd; 3 = 4th. `wins == placements[0]` and `losses == placements[1] + placements[2] + placements[3]`.
          items:
            type: integer

    DeckSummary:
      type: object
      description: Compact deck listing row (mirrors `hexapi.DeckSummary`).
      required: [id, owner, name, commander, card_count, bracket, color, imported_at]
      properties:
        id:
          type: string
        owner:
          type: string
        name:
          type: string
        commander:
          type: string
        commander_card:
          type: string
        card_count:
          type: integer
        bracket:
          type: string
          description: "Estimated WotC bracket (`b1`..`b5`)."
        color:
          type: string
          description: Color identity (single letters concatenated, e.g. `BRG`).
        imported_at:
          type: string
          format: date-time
        wbs:
          type: integer
        wbs_label:
          type: string
        pls:
          type: integer
        pls_label:
          type: string
        game_changer_count:
          type: integer
        archetype:
          type: string
        legal:
          type: boolean
        tags:
          type: array
          items:
            type: string

    OwnerProfile:
      type: object
      description: Public-facing owner profile (mirrors `hexapi.OwnerProfile`).
      required: [owner]
      properties:
        owner:
          type: string
        country:
          type: string
          description: ISO 3166-1 alpha-2 (uppercase). Empty when no preference is stored.
          minLength: 2
          maxLength: 2

    CardStatsOverview:
      type: object
      description: Aggregated per-card analytics (mirrors `db.CardStatsOverview`).
      required: [card_name, win_rate, games_played, wins, losses, inclusion_rate, decks_using, total_decks, top_commanders, bracket_distribution]
      properties:
        card_name:
          type: string
        win_rate:
          type: number
          format: double
        games_played:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        inclusion_rate:
          type: number
          format: double
        decks_using:
          type: integer
        total_decks:
          type: integer
        top_commanders:
          type: array
          items:
            $ref: '#/components/schemas/CardCommanderStat'
        bracket_distribution:
          type: array
          items:
            $ref: '#/components/schemas/CardBracketEntry'

    CardCommanderStat:
      type: object
      required: [commander, games, wins, win_rate]
      properties:
        commander:
          type: string
        games:
          type: integer
        wins:
          type: integer
        win_rate:
          type: number
          format: double

    CardBracketEntry:
      type: object
      required: [bracket, count]
      properties:
        bracket:
          type: integer
        count:
          type: integer

    UpgradeSuggestion:
      type: object
      description: One per-slot upgrade recommendation produced by `handleDeckUpgrade`.
      properties:
        current_card:
          type: string
        suggested_card:
          type: string
        current_win_rate:
          type: number
          format: double
        suggested_win_rate:
          type: number
          format: double
        win_rate_delta:
          type: number
          format: double
        reason:
          type: string

    StartGauntletResponse:
      type: object
      required: [status, deck_key, games]
      properties:
        status:
          type: string
          enum: [started, running]
        deck_key:
          type: string
        games:
          type: integer
        credits_charged:
          type: integer
          format: int64
          description: Present only on the paid-tier path; omitted when the run was free-tier.

    DeckListResponse:
      type: array
      items:
        $ref: '#/components/schemas/DeckSummary'

    EmptyOk:
      type: object
      description: Generic success body; specific fields are response-dependent.
      additionalProperties: true

    Tag:
      type: string
      description: Free-form tag string applied to a deck.

  parameters:
    OwnerParam:
      name: owner
      in: path
      required: true
      description: |
        Owner slug. Path components MUST satisfy `validatePathComponent`:
        non-empty, not "." or "..", no `/`, `\`, or NUL byte, and only
        `[A-Za-z0-9._-]`. Violations return `400 invalid owner` (or
        `invalid owner or id`).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]+$'
        examples: ["alice"]

    DeckIdParam:
      name: id
      in: path
      required: true
      description: Deck id. Same validation rules as `owner`.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]+$'
        examples: ["korvold_combo"]

    CardNameParam:
      name: name
      in: path
      required: true
      description: Card name (URL-escaped; spaces survive percent-decoding).
      schema:
        type: string
        examples: ["Sol Ring"]

    CardNameSlugParam:
      name: cardName
      in: path
      required: true
      description: Card name (URL-escaped) for the card-stats sub-tree.
      schema:
        type: string
        examples: ["Sol Ring"]

    CommanderParam:
      name: commander
      in: path
      required: true
      description: Commander name (URL-escaped).
      schema:
        type: string
        examples: ["Korvold, Fae-Cursed King"]

    GameIdParam:
      name: id
      in: path
      required: true
      description: Game UUID.
      schema:
        type: string
        format: uuid

    RoomIdParam:
      name: room_id
      in: path
      required: true
      description: Spectate room id.
      schema:
        type: string

    XHexDekOwner:
      name: X-HexDek-Owner
      in: header
      required: false
      description: |
        Caller identity used by the credits ledger and ownership
        checks. Lowercased before comparison. Absent → anonymous /
        free-tier path; required by ownership-gated mutating routes
        (`PUT /api/decks/{owner}/{id}`, `PATCH .../curse`, etc).
      schema:
        type: string

  responses:
    BadRequest:
      description: Validation failed — missing or malformed input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication for a gated route.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Caller authenticated but lacks ownership / admin rights.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflict (e.g. too many decks with the same name on clone).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PaymentRequired:
      description: |
        Caller exhausted the free-tier daily quota and either has
        insufficient credits to upgrade (`free_quota_exhausted`) or
        a credit-spend attempt failed with insufficient balance
        (`insufficient_credits`). Body extends `ErrorResponse` with
        `balance`, `needed`, and `quota`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseWithDetails'
    TooManyRequests:
      description: |
        Server-side rate limit / concurrency cap engaged. Examples:
        `gauntletSem` (capacity 2) is saturated; per-owner clone
        rate-limit exceeded; feedback rate-limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: A dependency (DB, anomaly auditor, contrib pipeline) is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: Upstream call (e.g. Moxfield) failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Server-side failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:
  ## ---------------------------------------------------------------
  ## Decks: CRUD + analysis + lineage
  ## ---------------------------------------------------------------

  /api/decks:
    get:
      tags: [decks]
      operationId: listDecks
      summary: List all decks, optionally filtered.
      parameters:
        - name: owner
          in: query
          required: false
          schema:
            type: string
        - name: contains
          in: query
          required: false
          description: Case-insensitive substring filter against deck name / commander.
          schema:
            type: string
      responses:
        "200":
          description: Deck list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckListResponse'
        "500": { $ref: '#/components/responses/InternalError' }

    post:
      tags: [decks]
      operationId: importDeck
      summary: Create a new deck from a pasted deck list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deck_list]
              properties:
                deck_list:
                  type: string
                  description: Plain-text deck list (one card per line).
                owner:
                  type: string
                name:
                  type: string
      responses:
        "201":
          description: Deck created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "409": { $ref: '#/components/responses/Conflict' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/decks/import:
    post:
      tags: [decks]
      operationId: importDeckExplicit
      summary: Alias for `POST /api/decks` (full-page import flow).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deck_list]
              properties:
                deck_list:
                  type: string
                owner:
                  type: string
                name:
                  type: string
      responses:
        "201":
          description: Deck created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "409": { $ref: '#/components/responses/Conflict' }

  /api/decks/{owner}/{id}:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    get:
      tags: [decks]
      operationId: getDeck
      summary: Get a single deck with cards, metadata, and freya summary.
      responses:
        "200":
          description: Deck detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/InternalError' }
    put:
      tags: [decks]
      operationId: updateDeck
      summary: Replace the deck's mainboard.
      parameters:
        - $ref: '#/components/parameters/XHexDekOwner'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deck_list]
              properties:
                deck_list:
                  type: string
      responses:
        "200":
          description: Deck updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [decks]
      operationId: patchDeck
      summary: Patch deck metadata (name, tags). Ownership-gated.
      parameters:
        - $ref: '#/components/parameters/XHexDekOwner'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                tags:
                  type: array
                  items:
                    $ref: '#/components/schemas/Tag'
      responses:
        "200":
          description: Deck metadata patched.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [decks]
      operationId: deleteDeck
      summary: Delete a deck. Ownership-gated.
      parameters:
        - $ref: '#/components/parameters/XHexDekOwner'
      responses:
        "200":
          description: Deck deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/decks/{owner}/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    get:
      tags: [decks]
      operationId: listDeckVersions
      summary: List historical versions of a deck.
      responses:
        "200":
          description: Version list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }

  /api/decks/{owner}/{id}/version-trends:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    get:
      tags: [decks]
      operationId: getDeckVersionTrends
      summary: Per-version winrate rollup for this deck. Buckets each game into the version that was HEAD at its finished_at timestamp.
      responses:
        "200":
          description: |
            Per-version rollup. `versions` lists every version in chronological order with its games/wins/losses/draws/win_rate (0..1).
            `untracked_games` counts games predating the earliest known version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }

  /api/decks/{owner}/{id}/analysis:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    get:
      tags: [decks]
      operationId: getDeckAnalysis
      summary: Get Freya analysis output (archetype, combos, win lines, roles).
      responses:
        "200":
          description: 'Freya strategy + deck profile JSON. Returns `{status:"analyzing"}` if analysis is in-flight.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/decks/{owner}/{id}/analyze:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    post:
      tags: [decks]
      operationId: runDeckAnalysis
      summary: Kick off Freya analysis for a deck.
      responses:
        "200":
          description: Analysis launch acknowledged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  deck:
                    type: string
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/decks/{owner}/{id}/matchups:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    get:
      tags: [decks]
      operationId: getDeckMatchups
      summary: Per-opponent matchup record for this deck.
      responses:
        "200":
          description: Matchup list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deck_key:
                    type: string
                  matchups:
                    type: array
                    items: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/decks/{owner}/{id}/elo-history:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    get:
      tags: [decks]
      operationId: getDeckEloHistory
      summary: Time-series of ELO deltas for this deck.
      responses:
        "200":
          description: ELO run history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deck_key:
                    type: string
                  runs:
                    type: array
                    items: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/decks/{owner}/{id}/upgrade:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
      - $ref: '#/components/parameters/DeckIdParam'
    get:
      tags: [decks]
      operationId: getDeckUpgrade
      summary: Suggest higher win-rate card swaps for this deck.
      responses:
        "200":
          description: Upgrade suggestions + meta (`reason` populated when suggestions are empty for an explainable reason — e.g. no card_stats data).
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items: { $ref: '#/components/schemas/UpgradeSuggestion' }
                  meta:
                    type: object
                    additionalProperties: true
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/decks/{owner}/{id}/clone:
    parameters:
      - $ref: '#/components/parameters/OwnerParam'
