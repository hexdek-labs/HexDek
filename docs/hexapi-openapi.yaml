          pattern: '^[A-Za-z0-9_.-]+$'
    get:
      tags: [profile]
      operationId: getPlayerTrends
      summary: Rolling-window trend metrics for a player.
      description: |
        Returns the player's recent-form snapshot — wins, win rate,
        archetype split, opponent breakdown — over a sliding window of
        the most recent games. When the player has no recorded games,
        returns a well-formed payload with `games_played: 0` and
        empty breakdowns so the frontend can render an empty state.
      parameters:
        - name: window
          in: query
          required: false
          description: Rolling window size (1..200; default 30).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 30
      responses:
        "200":
          description: Player trends document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }

