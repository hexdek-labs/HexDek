  /api/games/{id}/summary.pdf:
    parameters:
      - $ref: '#/components/parameters/GameIdParam'
    get:
      tags: [games]
      operationId: getGameSummaryPDF
      summary: Rendered PDF of the Heimdall summary for a game.
      responses:
        "200":
          description: PDF document.
          content:
            application/pdf: {}
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /api/games/summaries:
    get:
      tags: [games]
      operationId: searchGameSummaries
      summary: Search the archive of past game summaries.
      responses:
        "200":
          description: Search hits.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /api/games/compare:
    get:
      tags: [games]
      operationId: compareGames
      summary: Side-by-side comparison of two completed games.
      description: |
        Embeds rich Heimdall summaries when observation snapshots
        exist for both ids; degrades to "db_only" summaries for older
        games (MVPDiff is empty in that case, but outcome / turns /
        shared-deck diffs are still populated).
      parameters:
        - name: a
          in: query
          required: true
          description: First game id (integer, > 0).
          schema:
            type: integer
            minimum: 1
        - name: b
          in: query
          required: true
          description: Second game id (integer, > 0, distinct from `a`).
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Comparison document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /api/games/search:
    get:
      tags: [games]
      operationId: searchGames
      summary: Full-history game search with owner-relative win/loss filters.
      description: |
        Scans the full `showmatch_game` table. Distinct from
        `/api/games/summaries`, which only walks games that have a
        persisted observation snapshot and lacks the owner-relative
        filters.

        All query parameters are optional and combine with implicit
        AND. Malformed numeric values are silently ignored rather
        than rejected (`since` / `until` / `min_turn` / `max_turn` /
        `limit` / `offset` all fall back to their default when they
        fail to parse) — the one exception is `won`, which 400s on an
        unrecognised value and 400s when supplied without `owner`.

        `rows[].owner_seat` is `-1` when no `owner` filter was
        supplied; when `owner` is set, `rows[].owner_won` is
        `owner_seat == winner`. The response's `owner` field is
        always present and is the empty string when unfiltered.
      parameters:
        - name: owner
          in: query
          required: false
          description: |
            Restrict to games where this owner held a seat.
            Lowercased and trimmed, then validated with
            `validatePathComponent` — a violation is a 400.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_.-]+$'
        - name: q
          in: query
          required: false
          description: Case-insensitive substring against `winner_name`, `end_reason`, or any seat's commander.
          schema: { type: string }
        - name: won
          in: query
          required: false
          description: |
            Requires `owner`. Accepts `true|1|yes` or `false|0|no`
            (case-insensitive); anything else is a 400.
          schema:
            type: string
            enum: ["true", "1", "yes", "false", "0", "no"]
        - name: min_turn
          in: query
          required: false
          description: Inclusive lower bound on game length. Values <= 0 are ignored.
          schema: { type: integer, minimum: 1 }
        - name: max_turn
          in: query
          required: false
          description: Inclusive upper bound on game length. Values <= 0 are ignored.
          schema: { type: integer, minimum: 1 }
        - name: end_reason
          in: query
          required: false
          description: Exact case-insensitive match on the game's end reason.
          schema: { type: string }
        - name: since
          in: query
          required: false
          description: Inclusive lower bound on `finished_at` (Unix seconds). Negative values ignored.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: until
          in: query
          required: false
          description: Inclusive upper bound on `finished_at` (Unix seconds). Negative values ignored.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          required: false
          description: Page size. Default 50, clamped to 500 in the echoed value.
          schema: { type: integer, default: 50, maximum: 500 }
        - name: offset
          in: query
          required: false
          description: Pagination offset. Negative values are echoed back as 0.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Matching games, newest-first.
          content:
            application/json:
              schema:
                type: object
                required: [rows, count, limit, offset, owner]
                properties:
                  rows:
                    type: array
                    items: { $ref: '#/components/schemas/GameSearchRow' }
                  count:
                    type: integer
                    description: '`len(rows)` for THIS page — not the unpaged total.'
                  limit:
                    type: integer
                    description: Effective limit after defaulting and the 500 clamp.
                  offset:
                    type: integer
                    description: Effective offset (negatives normalized to 0).
                  owner:
                    type: string
                    description: Echo of the normalized owner filter; empty string when unfiltered.
        "400": { $ref: '#/components/responses/BadRequest' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /api/replay/{game_id}:
    parameters:
      - $ref: '#/components/parameters/ReplayGameIdParam'
    get:
      tags: [games]
      operationId: getReplayFull
      summary: Full replay as a single JSON document.
      description: |
        Same chronological event list that `GET /api/games/{id}/replay`
        streams as NDJSON, packaged in one envelope so a JS client can
        `await fetch().then(r => r.json())` instead of line-buffering.
        A `meta`-style header (`total_turns`, `winner`) lets consumers
        read the outcome without scanning every event.

        Shares the snapshot cache with `/api/games/{id}/replay`,
        `/summary` and `/summary.pdf`, so a snapshot warmed by any one
        path is reused here.

        Read-only and unauthenticated, matching the existing replay
        and summary endpoints.

        `total_turns` is `max(snapshot.Seed.Turns, snapshot.FinalTurn)`.
      responses:
        "200":
          description: Full replay document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FullReplayResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404":
          description: Game id unknown, or the game has no persisted observation snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /api/replay/{game_id}/turn/{n}:
    parameters:
      - $ref: '#/components/parameters/ReplayGameIdParam'
      - name: n
        in: path
        required: true
        description: Turn number to project to. Must parse as an integer >= 1; otherwise `400 invalid turn`.
        schema:
          type: integer
          minimum: 1
    get:
      tags: [games]
      operationId: getReplayTurnState
      summary: State-at-turn-N projection of a replay.
      description: |
        The persisted snapshot is END-OF-GAME, not per-turn, so this
        endpoint projects what was true "by turn N" from that single
        snapshot: events with `turn <= n`, and the MVP cards whose
        `turn_played` falls in `1..n`. It reflects the snapshot's
        information-theoretic limit, not a true per-turn replay — that
        would require every-turn snapshots.

        The terminal `game_end` event is suppressed when `n` is less
        than `total_turns`, since from turn N's perspective the game
        had not ended.

        Note the error ordering: the snapshot is loaded BEFORE `n` is
        parsed, so an unknown `game_id` combined with a malformed `n`
        reports the game error, not the turn error.
      responses:
        "200":
          description: Turn-N projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TurnStateResponse' }
        "400":
          description: Non-numeric / non-positive `game_id`, or a turn below 1.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: Game id unknown, or the game has no persisted observation snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /api/replay/{game_id}/forensics:
    parameters:
      - $ref: '#/components/parameters/ReplayGameIdParam'
    get:
      tags: [games]
      operationId: getReplayForensics
      summary: One-shot bundle of every post-game analysis signal for a game.
      description: |
        Assembles in a single round-trip what would otherwise need
        five separate hits: turning points (derived via the shared
        snapshot-summary builder), MVP cards, regret cards, mulligan
        stats, and commander zone visits.

        Every array is normalized to `[]` rather than `null` when
        empty, so a JS consumer never has to nil-check.
      responses:
        "200":
          description: Forensics bundle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForensicsResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404":
          description: Game id unknown, or the game has no persisted observation snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /api/players/compare:
    get:
      tags: [profile]
      operationId: comparePlayers
      summary: Side-by-side comparison of two players' rolling trends.
      parameters:
        - name: a
          in: query
          required: true
          description: First player id (same validation rules as `owner`).
          schema:
            type: string
            pattern: '^[A-Za-z0-9_.-]+$'
        - name: b
          in: query
          required: true
          description: Second player id, distinct from `a`.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_.-]+$'
        - name: window
          in: query
          required: false
          description: Rolling window size for per-player PlayerTrends (1..200; default 30).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 30
        - name: recent_window
          in: query
          required: false
          description: Sub-window for the "recent" half of rating velocity (1..100; default 10).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: PlayerComparison body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /api/players/{id}/trends:
    parameters:
      - name: id
        in: path
        required: true
        description: Player slug (same validation rules as `owner`).
        schema:
          type: string
          pattern: '^[A-Za-z0-9_.-]+$'
    get:
      tags: [profile]
      operationId: getPlayerTrends
      summary: Rolling-window trend metrics for a player.
      description: |
        Returns the player's recent-form snapshot — wins, win rate,
        archetype split, opponent breakdown — over a sliding window of
        the most recent games. When the player has no recorded games,
        returns a well-formed payload with `games_played: 0` and
        empty breakdowns so the frontend can render an empty state.
      parameters:
        - name: window
          in: query
          required: false
          description: Rolling window size (1..200; default 30).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 30
      responses:
