  ## ---------------------------------------------------------------
  ## GraphQL POC (minimal, opt-in)
  ## ---------------------------------------------------------------

  /graphql:
    post:
      tags: [graphql]
      operationId: graphqlPost
      summary: GraphQL endpoint over the game graph (POC).
      description: |
        Minimal viable proof-of-concept. The schema currently exposes
        two root queries — `game(id: Int!)` and `games(limit: Int)`
        — backed by Showmatch's in-memory CompletedGame history.
        Selective field projection + aliasing are the primary
        ergonomics this surface buys over REST.

        Per the GraphQL transport spec, validation / execution
        errors are surfaced as a 200 response with `errors`
        populated, NOT as a 4xx. HTTP failure codes are reserved
        for transport-level problems (malformed body, missing
        query).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: GraphQL query document.
                variables:
                  type: object
                  additionalProperties: true
                operationName:
                  type: string
      responses:
        "200":
          description: GraphQL execution result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
                  errors:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "400": { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [graphql]
      operationId: graphqlGet
      summary: Ad-hoc browser query form (?query=&variables=).
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: variables
          in: query
          required: false
          description: JSON-encoded variable map.
          schema:
            type: string
        - name: operationName
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: GraphQL execution result. Same shape as POST.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": { $ref: '#/components/responses/BadRequest' }
