  /api/games/{id}:
    parameters:
      - $ref: '#/components/parameters/GameIdParam'
    get:
      tags: [games]
      operationId: getGameByID
      summary: Get a completed game by id (lite view).
      responses:
        "200":
          description: Game lite view.
          content:
