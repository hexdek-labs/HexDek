  ## ---------------------------------------------------------------
  ## Telemetry / Feedback / Webhooks
  ## ---------------------------------------------------------------

  /api/telemetry/pageview:
    post:
      tags: [telemetry]
      operationId: telemetryPageview
      summary: Record an anonymous page-view event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [anon_id, path]
              properties:
                anon_id:
                  type: string
                  format: uuid
                path:
                  type: string
      responses:
        "204":
          description: Recorded (no body).
        "400": { $ref: '#/components/responses/BadRequest' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/telemetry/stitch:
    post:
      tags: [telemetry]
      operationId: telemetryStitch
      summary: Backfill-stitch an anonymous telemetry session to an owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [anon_id, owner]
              properties:
                anon_id:
                  type: string
                  format: uuid
                owner:
                  type: string
      responses:
        "200":
          description: Stitch result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyOk' }
        "204":
          description: Skipped (silent).
        "400": { $ref: '#/components/responses/BadRequest' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/telemetry/error:
    post:
      tags: [telemetry]
      operationId: telemetryError
      summary: Record a frontend error report (ErrorBoundary / uncaught / rejection).
      description: |
        First-party error sink for the frontend instrumentation
        (hexdek/src/lib/errorTelemetry.js). anon_id is OPTIONAL — iOS
        private mode blocks localStorage, so storage-blocked sessions
        have no anon id by construction; a malformed anon_id is stored
        as NULL rather than rejecting the report. Per-IP rate limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                anon_id:
                  type: string
                  format: uuid
                message:
                  type: string
                stack:
                  type: string
                kind:
                  type: string
                  description: chunk | storage | render | uncaught | rejection
                source:
                  type: string
                  description: boundary | window | promise
                path:
                  type: string
                timestamp:
                  type: integer
                  format: int64
      responses:
        "204":
          description: Recorded (no body).
        "400": { $ref: '#/components/responses/BadRequest' }
        "429": { $ref: '#/components/responses/TooManyRequests' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/csrf:
    get:
      tags: [csrf]
      operationId: issueCSRFToken
      summary: Mint a stateless CSRF token for use against destructive endpoints.
      description: |
        Returns a base64url-encoded token bound to a server-side HMAC secret. Echo
        the value back in the `X-CSRF-Token` request header on `DELETE /api/decks/{owner}/{id}`
        and `POST /api/decks/{owner}/{id}/clone`. Returns `503` when the server has not
        opted into token-based CSRF (`HEXDEK_CSRF_ENFORCE != 1`); clients should treat
        that as a signal to fall back to the existing custom-header-only protection.
        Tokens carry a 1-hour TTL by default.
      responses:
        "200":
          description: Fresh token issued.
          headers:
            Cache-Control:
              description: Always `no-store` — tokens MUST NOT be cached or shared.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at, header]
                properties:
                  token:
                    type: string
                    description: Opaque token blob — echo unchanged in the named header.
                  expires_at:
                    type: integer
                    format: int64
                    description: Unix seconds at which the token stops verifying.
                  header:
                    type: string
                    description: HTTP header name the server expects the token in (always `X-CSRF-Token`).
        "503": { $ref: '#/components/responses/InternalError' }

  /api/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Process liveness + readiness probe.
      description: |
        Always returns 200 with a small JSON body. Intended for
        orchestrator readiness checks. The `status` field is always
        `ok` for served requests (a request reached the handler →
        HTTP server is alive); use the `db_reachable` boolean to
        distinguish "process up, DB down" from "process down".
        Carries `Cache-Control: no-store` so intermediate caches
        can never mask a real outage with a stale "all green".
      responses:
        "200":
          description: Health payload.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [status, uptime_sec, version, db_reachable]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  uptime_sec:
                    type: integer
                    format: int64
                    description: Wall-clock seconds since process boot (or first /api/health observation).
                  version:
                    type: string
                    description: Build version string; "dev" when not set via -ldflags.
                  db_reachable:
                    type: boolean
                    description: True iff a sub-500ms ping on the SQLite connection succeeded.
                  dependencies:
                    type: object
                    additionalProperties: { type: string, enum: [ok, fail] }
                    description: Per-dependency liveness (scylla, freya, hat).
                  deck_pool:
                    type: object
                    description: >
                      Engine deck-pool lookup outcomes since boot. `rejected` non-zero
                      means real users were refused a gauntlet. Added after the pool
                      spent ~50 hours silently excluding every deck imported after
                      server start, with no counter anywhere to reveal it.
                    properties:
                      misses:
                        type: integer
                        format: int64
                        description: Lookups not satisfied from the in-memory pool.
                      recovered:
                        type: integer
                        format: int64
                        description: Misses resolved by parsing the deck file from disk.
                      rejected:
                        type: integer
                        format: int64
                        description: Misses that could not be recovered — a user was refused.

  /api/feedback:
    post:
      tags: [feedback]
      operationId: submitFeedback
      summary: Submit user feedback.
      description: Rate-limited per caller — the handler returns `429` once a per-window limit is exceeded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symptom]
              properties:
                symptom:
                  type: string
                note:
                  type: string
                owner:
                  type: string
      responses:
        "200":
          description: Feedback accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "400": { $ref: '#/components/responses/BadRequest' }
        "429": { $ref: '#/components/responses/TooManyRequests' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/kofi/webhook:
    post:
      tags: [webhooks]
      operationId: kofiWebhook
      summary: Ko-fi donation webhook receiver.
      description: |
        Inbound webhook from Ko-fi. Body is the Ko-fi-defined
        `application/x-www-form-urlencoded` shape (one `data` field
        holding a JSON document). Signature is verified against the
        shared secret server-side.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                data:
                  type: string
      responses:
        "200":
          description: Webhook accepted.

