              schema: { $ref: '#/components/schemas/EmptyOk' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/events/{game_id}/stream:
    parameters:
      - $ref: '#/components/parameters/ReplayGameIdParam'
    get:
      tags: [live]
      operationId: gameEventStreamSSE
      summary: Server-Sent Events stream of significant engine events for one game.
      description: |
        One-way read-only companion to the global bidirectional
        `/ws/events` WebSocket, scoped to a single game. SSE is plain
        HTTP/1.1, so it survives proxies that block WS upgrades,
        needs no client library (browser `EventSource`), and
        reconnects automatically.

        The handler subscribes to the global EventBus with no type
        filter and filters per-frame by extracting `game_id` from the
        event payload. An event that carries no `game_id` is dropped
        rather than broadcast — a cluster-wide event must not surface
        on a per-game stream.

        Frame sequence: one `ready` event immediately on connect
        (`EventSource` cannot otherwise distinguish "connected" from
        "no messages yet"), then one frame per matching engine event,
        with a `: ping` comment every 15s to keep idle proxies from
        severing the connection.

        Event types currently surfaced: `game.turn_transition`,
        `game.combo_fired`, `game.player_loss`, `game.end`. The wire
        format does not gate on an enum, so new types appear without
        a spec change.

        Rate-limited per-IP BEFORE the upgrade, since every reconnect
        would otherwise consume a subscriber slot and a goroutine.
      responses:
        "200":
          description: |
            SSE stream. The opening frame is `event: ready` with
            `{game_id, server_now}`. Every later frame's `data:` line
            is a JSON object `{event, data, timestamp}` where
            `timestamp` is RFC3339Nano and `data` is the raw
            publisher payload (shape varies by event type).
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: '#/components/responses/BadRequest' }
        "429": { $ref: '#/components/responses/TooManyRequests' }
        "500":
          description: The underlying ResponseWriter does not support flushing, so streaming is impossible.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "503":
          description: Event bus not configured in this binary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/spectator/lineage/{instance_id}:
    parameters:
      - name: instance_id
        in: path
        required: true
        description: |
          Canonical InstanceID. Validated against
          `^[a-z][0-3](OG|TK|CP|AB)(V|H)(C|[WUBRG]{1,5})[0-9]+$`
          before any work is done — the pattern doubles as a
          path-traversal / log-injection guard. A non-matching value
          is a 400.
        schema:
          type: string
          pattern: '^[a-z][0-3](OG|TK|CP|AB)(V|H)(C|[WUBRG]{1,5})[0-9]+$'
    get:
      tags: [spectate]
      operationId: getSpectatorLineage
      summary: Provenance tree for one card instance in a live spectate room.
      description: |
        Scans every live spectate room's most-recent snapshot for the
        requested InstanceID, then walks that room's lineage forest.
        The InstanceID system is per-game, so lineage is never
        cross-walked between rooms — once the owning room is found,
        the whole tree comes from that room's snapshot.

        `404` when the ID is unknown to every live room's CURRENT
        snapshot: the card has ceased, the game ended and the room
        was torn down, or the ID was never minted in a live game.

        Rate-limited on both the per-IP and per-owner
        (`X-HexDek-Owner`) axes, charged BEFORE the room scan —
        a format-valid-but-unknown ID costs a full scan of every
        room, so the 404 path is as expensive as a hit and must be
        throttled identically.
      parameters:
        - $ref: '#/components/parameters/XHexDekOwner'
      responses:
        "200":
          description: Lineage tree for the instance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LineageResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/TooManyRequests' }
        "503":
          description: Spectator room manager not available in this binary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /ws/live:
    get:
      tags: [live]
      operationId: spectatorWs
      summary: WebSocket — live game spectator feed.
      description: "WebSocket upgrade endpoint (not modelled by OpenAPI). Connect with `Sec-WebSocket-Version: 13`."
      responses:
        "101":
          description: Switching Protocols → WebSocket.

  /ws/spectate/{room_id}:
    parameters:
      - $ref: '#/components/parameters/RoomIdParam'
    get:
      tags: [spectate]
      operationId: spectateRoomWs
      summary: WebSocket — per-room spectator feed.
      responses:
        "101":
          description: Switching Protocols → WebSocket.

  /ws/events:
    get:
      tags: [live]
      operationId: eventsWs
      summary: WebSocket — generic engine events stream (game.end + future event types).
      description: |
        Real-time push of discrete engine events without polling.
        Default subscription on connect is "all events"; clients
        can narrow via `{"action":"subscribe","events":["game.end"]}`
        and exercise liveness via `{"action":"ping"}` → server
        replies with `{"event":"pong","data":{"server_time":...}}`.

        Capacity-capped at 100 concurrent sessions; further upgrades
        return `503 too many event subscribers` as the unified
        ErrorResponse envelope before the WebSocket handshake.

        Per-subscriber outgoing buffer is 64 messages. Publisher
        drops to slow consumers rather than blocking the engine
        loop — clients should reconnect and treat the stream as
        lossy (the webhook system covers the durable side).
      responses:
        "101":
          description: Switching Protocols → WebSocket.
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

