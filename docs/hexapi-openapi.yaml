      operationId: spectatorWs
      summary: WebSocket — live game spectator feed.
      description: "WebSocket upgrade endpoint (not modelled by OpenAPI). Connect with `Sec-WebSocket-Version: 13`."
      responses:
        "101":
          description: Switching Protocols → WebSocket.

  /ws/spectate/{room_id}:
    parameters:
      - $ref: '#/components/parameters/RoomIdParam'
    get:
      tags: [spectate]
      operationId: spectateRoomWs
      summary: WebSocket — per-room spectator feed.
      responses:
