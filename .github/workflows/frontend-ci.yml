# Frontend CI (r61) — the net that was missing when the `pls`
# ReferenceError (55386105) and the cardSearchOpen TDZ (fixed in
# 44550a26) shipped: nothing built, linted, or smoke-tested hexdek/ on
# PR. Three jobs:
#
#   build       — vite production build (catches syntax/import breakage)
#               + the node --test unit suite (lib helpers, parsers).
#   lint        — BLOCKING gate on eslint.config.ci.js (crash-class rules
#                 only; currently no-undef — see the ratchet plan in that
#                 file) + the full eslint config as a non-blocking
#                 visibility step (160+ pre-existing errors; gating it
#                 outright would make CI permanently red on old debt).
#   smoke       — the existing Playwright e2e smoke suite plus the
#                 render-crash regression spec, against a Playwright-
#                 launched vite dev server (playwright.e2e.config.ts)
#                 pointed at the production backend (the suite's design
#                 target — Spectator/Forge need live data to mount their
#                 containers at all; verified they cannot pass hermetically).
#                 The render-crash regression spec IS hermetic (nonexistent
#                 deck slug) so it holds regardless of backend health.
#                 Dev-mode (unminified) is deliberate — TDZ ReferenceErrors
#                 reproduce there but are masked by the production
#                 minifier's const→var. If this job reds out with
#                 backend-unreachable symptoms, that's real signal about
#                 hexdek.dev, not the PR.

name: frontend-ci

on:
  pull_request:
    paths:
      - 'hexdek/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'hexdek/**'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: hexdek

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hexdek/package-lock.json
      - run: npm ci
      - name: Production build
        run: npx vite build
        env:
          VITE_API_URL: ''
      - name: Unit tests
        run: npm run test:unit

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hexdek/package-lock.json
      - run: npm ci
      - name: Crash-class lint gate (blocking)
        run: npx eslint --config eslint.config.ci.js src
      - name: Full lint (visibility only — pre-existing debt, do not gate yet)
        run: npx eslint src
        continue-on-error: true

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hexdek/package-lock.json
      - run: npm ci
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke + render-crash regression
        # No HEXDEK_API_URL override: the config's default backend
        # (https://hexdek.dev) is the suite's design target. See the
        # header comment for why a hermetic run can't work for the
        # smoke specs.
        run: npx playwright test --config=playwright.e2e.config.ts
      - name: Upload screenshots + report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            hexdek/e2e/screenshots/
            hexdek/e2e/report/
            hexdek/e2e/test-results/
          retention-days: 7
